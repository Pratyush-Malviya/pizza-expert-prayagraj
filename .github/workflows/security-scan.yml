name: Security Scan

on:
  push:
    branches: [ "master", "main", "security-hardening" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Run linter
        run: npm run lint
